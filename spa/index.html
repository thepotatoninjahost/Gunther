<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0C0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gunther</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b0c0b; color: #3dff6b; }
      body { font-family: system-ui, sans-serif; }
    </style>
    <script>
      window.addEventListener("error", function (event) {
        var node = document.createElement("pre");
        node.setAttribute("data-boot-error", "1");
        node.style.cssText = "padding:16px;color:#3dff6b;white-space:pre-wrap;font:14px/1.4 sans-serif";
        node.textContent = (event.error && event.error.stack) || event.message || "script error";
        (document.body || document.documentElement).appendChild(node);
      }, true);
    </script>
  </head>
  <body>
    <div id="root">Loading Gunther…</div>
    <script type="module" src="../src/mobile-entry.tsx"></script>
  </body>
</html>
